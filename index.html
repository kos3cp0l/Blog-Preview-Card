<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Blog Preview Card</title>
</head>
<body>
    <main class="blog-preview-card">
        <img 
            src="assets/illustration-article.svg" 
            alt="HTML and CSS foundations article image" 
            class="article-image"
        />
        <p class="article-type">Learning</p>
        <small class="date-published">Published 
            <time datetime="2023-12-21">21 Dec 2023</time>
        </small>
        
        <h1 class="article-title">HTML & CSS foundations</h1>
        <p class="article-description">
            These languages are the backbone of every website, 
            defining structure, content and presentation.
        </p>

        <span class="avatar-footer">
            <img src="assets/my-avatar.jpg" alt="My avatar image" id="avatar-image">
            Melvyn Kowac
        </span>
    </main>

    <footer id="footer">
        Challenged by 
        <a href="https://frontendmentor.io/">Frontend Mentor</a>. 
        Coded by 
        <a href="https://www.github.com/kos3cp0l">Melvyn Kowac</a>.
    </footer>
</body>
</html>
